<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I'm So Sorry! 🥺</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div id="card" class="card">
            <div class="image-section">
                <img src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExOHpueGZ3bmZ3bmZ3bmZ3bmZ3bmZ3bmZ3bmZ3bmZ3bmZ3JmVwPXYxX2ludGVybmFsX2dpZl9ieV9pZCZjdD1z/v6aOebdEG8wS6paxZ6/giphy.gif" alt="Cute Bunny" id="status-img">
            </div>
            
            <div class="text-section">
                <h1 id="question">Will you please forgive me?</h1>
                <p id="message">I know I acted like a silly bunny. I really value our bond and I'm truly sorry for hurting you. Can we make things right?</p>
            </div>

            <div class="buttons">
                <button id="yesBtn" class="btn yes-btn">Yes, I Forgive You</button>
                <button id="noBtn" class="btn no-btn">No 😡</button>
            </div>
        </div>
    </div>
    
    <div class="bg-hearts" id="heart-container"></div>

    <script src="script.js"></script>
</body>
</html>
